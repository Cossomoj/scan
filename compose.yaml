services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      signature-processor:
        condition: service_started
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONVERTER_URL: http://converter:3001
      SIGNATURE_PROCESSOR_URL: http://signature-processor:8000
      ADMIN_CREDENTIAL: ${ADMIN_CREDENTIAL:-}
    volumes:
      - sign_data:/app/data
    networks:
      - internal
      - conversion
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 768m
  converter:
    build: ./converter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=384m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    networks:
      - conversion
  signature-processor:
    build: ./signature-processor
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 384m
    cpus: 1.0
    networks:
      - conversion
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    labels:
      com.list-sign.config-version: zapdf-2026-11-upload
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
    mem_limit: 128m
volumes:
  sign_data:
  caddy_data:
  caddy_config:
networks:
  internal:
  conversion:
    internal: true
