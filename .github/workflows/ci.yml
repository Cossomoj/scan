name: Test and deploy
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r signature-processor/requirements.txt
      - run: python -m unittest discover -s signature-processor -p 'test_*.py'
      - name: Build and check signature processor
        run: |
          docker build -t signature-processor-ci ./signature-processor
          docker run -d --rm --name signature-processor-ci -p 127.0.0.1:18080:8000 signature-processor-ci
          trap 'docker stop signature-processor-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/health >/dev/null
          python -c "from PIL import Image; Image.new('RGB', (80,40), 'white').save('/tmp/signature-ci.png')"
          curl -fsS -H 'Content-Type: image/png' --data-binary @/tmp/signature-ci.png http://127.0.0.1:18080/extract -o /tmp/signature-result-ci.png
          python -c "from PIL import Image; im=Image.open('/tmp/signature-result-ci.png').convert('RGBA'); assert im.size == (80,40) and im.getpixel((0,0))[3] == 0"
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy through restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          test -n "$DEPLOY_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' '92.63.101.127 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJSjbus66za62kqD8VU1oiRPMGP+5/0TEmIz0sov/232' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          git archive --format=tar.gz HEAD | ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes root@92.63.101.127
